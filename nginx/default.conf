map $cookie_server_ip $backend {
    ""       app_server;
    default  $cookie_server_ip:5000;
}

upstream app_server {
    server app:5000;
}

server {
    listen 80;

    location / {
        proxy_pass http://$backend;
        proxy_connect_timeout 1s;
        error_page 502 504 = @fallback;
    }

    location @fallback {
        proxy_pass http://app_server;
    }
}